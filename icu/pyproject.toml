[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "icu_data_warehouse",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
    "E731",  # lambda assignment (used for small local key functions)
    "E741",  # ambiguous name `l` (used for lap/list loop variables)
    "B905",  # zip(strict=) would change behaviour on unequal-length streams
    "UP042", # StrEnum changes str() output of existing enums
    "UP028", # yield-from rewrite of generator loops
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "B007", "E402", "E701", "E702"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external API access (skipped in CI)",
]
